<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP試験 単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F3EE;
    --paper-line:#E6EAF0;
    --card-bg:#FFFFFF;
    --ink:#232323;
    --ink-soft:#5B6068;
    --ink-faint:#9AA0A8;
    --border:#E1DED4;
    --tech:#2557C7;
    --mgmt:#B7791F;
    --strategy:#6B4FA0;
    --security:#0F766E;
    --other:#6B7280;
    --red-sheet:#E4483A;
    --red-sheet-2:#FF7A63;
    --green-pen:#1B7A4A;
    --brass:#C9A227;
    --shadow: 0 1px 2px rgba(20,20,20,.05), 0 10px 28px -14px rgba(20,20,20,.22);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  .app{max-width:720px;margin:0 auto;padding:18px 16px 64px;}

  /* ---------- header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 4px 16px;border-bottom:2px dashed var(--border);margin-bottom:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;
    background:var(--ink);color:var(--paper);padding:4px 7px;border-radius:6px;letter-spacing:.04em;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.01em;}
  .streak{
    display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;
    font-size:13px;color:var(--ink-soft);background:#fff;border:1px solid var(--border);
    padding:5px 10px;border-radius:999px;box-shadow:var(--shadow);
  }
  .streak strong{color:var(--ink);font-size:14px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:18px;}
  .tab{
    flex:1;padding:10px 6px 9px;border:1px solid var(--border);border-bottom:none;
    background:#fff;color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;
    border-radius:10px 10px 0 0;position:relative;top:2px;transition:transform .15s ease, top .15s ease;
    border-top:3px solid transparent;font-family:inherit;
  }
  .tab[data-tab="review"]{border-top-color:var(--red-sheet);}
  .tab[data-tab="add"]{border-top-color:var(--green-pen);}
  .tab[data-tab="list"]{border-top-color:var(--tech);}
  .tab[data-tab="stats"]{border-top-color:var(--brass);}
  .tab.active{color:var(--ink);top:0;box-shadow:var(--shadow);}
  .tab:focus-visible{outline:2px solid var(--tech);outline-offset:2px;}

  .view{display:none;}
  .view.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- generic card shell ---------- */
  .panel{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;
  }
  .ring-holes{display:flex;justify-content:center;gap:22px;margin:-20px -20px 16px;
    padding:8px 0;background:linear-gradient(180deg,#EFE2B8,var(--brass) 220%);
    border-radius:var(--radius) var(--radius) 0 0;}
  .ring-holes span{width:10px;height:10px;border-radius:50%;background:var(--paper);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}

  h2.section-title{font-size:14px;margin:0 0 12px;color:var(--ink-soft);font-weight:600;
    letter-spacing:.02em;display:flex;align-items:center;gap:8px;}

  /* ---------- category chip ---------- */
  .chip{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:999px;font-family:'IBM Plex Mono',monospace;
    border:1px solid transparent;cursor:default;
  }
  .chip.tech{color:var(--tech);background:color-mix(in srgb, var(--tech) 12%, white);}
  .chip.mgmt{color:var(--mgmt);background:color-mix(in srgb, var(--mgmt) 14%, white);}
  .chip.strategy{color:var(--strategy);background:color-mix(in srgb, var(--strategy) 12%, white);}
  .chip.security{color:var(--security);background:color-mix(in srgb, var(--security) 12%, white);}
  .chip.other{color:var(--other);background:color-mix(in srgb, var(--other) 14%, white);}

  .chip-toggle{cursor:pointer;user-select:none;opacity:.4;border:1px solid var(--border);transition:opacity .15s, transform .1s;}
  .chip-toggle.on{opacity:1;}
  .chip-toggle:active{transform:scale(.96);}

  /* ---------- review view ---------- */
  .review-setup{margin-bottom:14px;}
  .cat-filter-row{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px;}
  .due-count{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .due-count strong{color:var(--ink);font-size:15px;}

  .flip-stage{perspective:1400px;margin-top:6px;}
  .review-card{
    position:relative;min-height:290px;background:var(--card-bg);
    border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:26px 22px 20px;display:flex;flex-direction:column;
  }
  .card-meta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .exam-ref{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
    border:1px dashed var(--border);padding:2px 7px;border-radius:6px;}

  .term-face{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:10px;padding:10px 0 20px;}
  .term-face .term-word{font-size:26px;font-weight:700;line-height:1.4;}
  .term-hint{font-size:12px;color:var(--ink-faint);}

  .answer-wrap{position:relative;border-radius:12px;overflow:hidden;min-height:130px;
    background:var(--paper);border:1px solid var(--border);}
  .answer-content{padding:16px 16px 18px;}
  .answer-short{color:var(--green-pen);font-weight:700;font-size:17px;line-height:1.55;margin:0 0 10px;}
  .answer-detail{color:var(--ink-soft);font-size:13.5px;line-height:1.7;margin:0 0 8px;white-space:pre-wrap;}
  .answer-block-label{font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;
    margin:10px 0 3px;text-transform:uppercase;letter-spacing:.04em;}
  .mnemonic-box{border:1px dashed var(--brass);background:#FFFBEF;border-radius:8px;
    padding:8px 10px;font-size:13px;color:#8A6A12;margin-top:6px;}
  .related-line{font-size:12.5px;color:var(--ink-faint);margin-top:8px;}

  .red-sheet{
    position:absolute;inset:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(135deg, var(--red-sheet-2), var(--red-sheet) 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:#fff;transition:transform .5s cubic-bezier(.4,0,.2,1), opacity .4s ease .05s;
    transform-origin:top left;
  }
  .red-sheet span{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.03em;}
  .red-sheet svg{width:22px;height:22px;opacity:.9;}
  .red-sheet.lifted{transform:translate(38%,-34%) rotate(-9deg) scale(.82);opacity:0;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){
    .red-sheet{transition:opacity .2s ease;}
    .red-sheet.lifted{transform:none;}
  }

  .answer-actions{display:flex;gap:8px;margin-top:16px;}
  .abtn{flex:1;border:none;border-radius:10px;padding:12px 4px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:'Noto Sans JP',sans-serif;color:#fff;transition:transform .1s ease, filter .15s;}
  .abtn:active{transform:scale(.97);}
  .abtn:disabled{opacity:.35;cursor:not-allowed;}
  .abtn.again{background:var(--red-sheet);}
  .abtn.unsure{background:var(--brass);}
  .abtn.know{background:var(--green-pen);}
  .abtn small{display:block;font-weight:400;font-size:10.5px;opacity:.85;margin-top:2px;font-family:'IBM Plex Mono',monospace;}

  .box-dots{display:flex;gap:4px;align-items:center;}
  .box-dots span{width:7px;height:7px;border-radius:50%;background:var(--border);}
  .box-dots span.filled{background:var(--ink-soft);}

  .empty-state{text-align:center;padding:34px 14px;color:var(--ink-soft);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}
  .empty-state p{font-size:13.5px;line-height:1.7;margin:6px 0 14px;}
  .btn-primary{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:10px 18px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:10px;
    padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}

  /* ---------- add/edit form ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field .req{color:var(--red-sheet);}
  .field input[type=text],.field textarea,.field select{
    width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 11px;
    font-size:14px;font-family:'Noto Sans JP',sans-serif;background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;line-height:1.6;}
  .field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible{
    outline:2px solid var(--tech);outline-offset:1px;
  }
  .field-hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.two-col{grid-template-columns:1fr;}}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .form-actions .btn-ghost{display:none;}
  .form-actions.editing .btn-ghost{display:inline-block;}

  /* ---------- list view ---------- */
  .list-controls{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .search-input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    font-size:14px;font-family:'Noto Sans JP',sans-serif;background:#fff;}
  .filter-row{display:flex;flex-wrap:wrap;gap:7px;}
  .list-count{font-size:12.5px;color:var(--ink-faint);margin:2px 2px 4px;}

  .card-row{
    display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--border);
    border-radius:12px;padding:12px 13px;margin-bottom:9px;position:relative;overflow:hidden;
  }
  .card-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .card-row.tech::before{background:var(--tech);}
  .card-row.mgmt::before{background:var(--mgmt);}
  .card-row.strategy::before{background:var(--strategy);}
  .card-row.security::before{background:var(--security);}
  .card-row.other::before{background:var(--other);}
  .row-main{flex:1;min-width:0;padding-left:6px;}
  .row-term{font-weight:700;font-size:14.5px;margin-bottom:3px;}
  .row-def{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .row-tags{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .row-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:8px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn svg{width:15px;height:15px;}
  .confirm-row{display:flex;gap:6px;align-items:center;font-size:11.5px;}
  .confirm-row button{border:none;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;}
  .confirm-row .yes{background:var(--red-sheet);color:#fff;}
  .confirm-row .no{background:var(--paper);color:var(--ink-soft);}

  /* ---------- stats view ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;}
  .stat-card .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .stat-card .lbl{font-size:11px;color:var(--ink-faint);margin-top:3px;}
  .box-bars{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .box-bar-row{display:flex;align-items:center;gap:10px;font-size:12px;}
  .box-bar-row .bl{width:64px;flex-shrink:0;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .box-bar-track{flex:1;height:12px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .box-bar-fill{height:100%;background:linear-gradient(90deg,var(--tech),var(--strategy));border-radius:6px 0 0 6px;transition:width .4s ease;}
  .box-bar-row .bn{width:22px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);}
  .cat-stats{display:flex;flex-direction:column;gap:8px;}
  .cat-stat-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;
    background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 12px;}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.25);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{background:var(--red-sheet);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="brand-badge">AP</span>
      <h1>単語帳</h1>
    </div>
    <div class="streak">🔥 <strong id="streakCount">0</strong>日連続</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="review">復習</button>
    <button class="tab" data-tab="add">追加</button>
    <button class="tab" data-tab="list">一覧</button>
    <button class="tab" data-tab="stats">統計</button>
  </div>

  <main>
    <!-- ============ REVIEW ============ -->
    <section id="view-review" class="view active">
      <div id="reviewSetup" class="review-setup"></div>
      <div id="reviewArea"></div>
    </section>

    <!-- ============ ADD ============ -->
    <section id="view-add" class="view">
      <div class="panel">
        <div class="ring-holes"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <h2 class="section-title" id="formTitle">新しいカードを追加</h2>
        <div id="cardForm">
          <div class="field">
            <label for="f-term">用語 <span class="req">必須</span></label>
            <input type="text" id="f-term" placeholder="例：SLA（サービスレベル合意）">
          </div>
          <div class="two-col">
            <div class="field">
              <label for="f-cat">分野 <span class="req">必須</span></label>
              <select id="f-cat">
                <option value="tech">テクノロジ系</option>
                <option value="security">セキュリティ</option>
                <option value="mgmt">マネジメント系</option>
                <option value="strategy">ストラテジ系</option>
                <option value="other">その他</option>
              </select>
            </div>
            <div class="field">
              <label for="f-ref">出題例（任意）</label>
              <input type="text" id="f-ref" placeholder="例：R6春 午前 問34">
            </div>
          </div>
          <div class="field">
            <label for="f-short">一言でいうと <span class="req">必須</span></label>
            <textarea id="f-short" placeholder="復習カードの答えとして最初に表示される、一番大事な一文"></textarea>
            <div class="field-hint">ここが「答え」の核。短く言い切れる形で書くと後で思い出しやすい。</div>
          </div>
          <div class="field">
            <label for="f-detail">詳しい説明（任意）</label>
            <textarea id="f-detail" placeholder="なぜ重要か、どう使われるか、間違えやすいポイントなど"></textarea>
          </div>
          <div class="field">
            <label for="f-mnemonic">覚え方のコツ（任意）</label>
            <input type="text" id="f-mnemonic" placeholder="語呂合わせ、イメージ、身近な例など">
          </div>
          <div class="field">
            <label for="f-related">関連用語（任意）</label>
            <input type="text" id="f-related" placeholder="カンマ区切りで（例：RTO, RPO, 可用性）">
          </div>
          <div class="form-actions" id="formActions">
            <button type="button" class="btn-primary" id="submitBtn">カードを追加</button>
            <button type="button" class="btn-ghost" id="cancelEditBtn">編集をやめる</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ LIST ============ -->
    <section id="view-list" class="view">
      <div class="list-controls">
        <input type="text" id="searchInput" class="search-input" placeholder="用語や説明を検索…">
        <div class="filter-row" id="listCatFilter"></div>
      </div>
      <div class="list-count" id="listCount"></div>
      <div id="listArea"></div>
    </section>

    <!-- ============ STATS ============ -->
    <section id="view-stats" class="view">
      <div id="statsArea"></div>
    </section>
  </main>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var CATS = {
    tech:     { label:'テクノロジ系',   cls:'tech' },
    security: { label:'セキュリティ',   cls:'security' },
    mgmt:     { label:'マネジメント系', cls:'mgmt' },
    strategy: { label:'ストラテジ系',   cls:'strategy' },
    other:    { label:'その他',         cls:'other' }
  };
  var CAT_ORDER = ['tech','security','mgmt','strategy','other'];
  var INTERVAL_DAYS = {1:0, 2:2, 3:4, 4:8, 5:16};

  var cards = [];
  var streak = { count:0, lastDate:'' };
  var reviewQueue = [];
  var currentCard = null;
  var revealed = false;
  var editingId = null;
  var reviewCatFilter = new Set(CAT_ORDER);
  var listCatFilter = new Set(CAT_ORDER);
  var listSearch = '';
  var confirmDeleteId = null;

  // ---------- utils ----------
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function addDays(dateStr, n){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+n);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showToast(msg, kind){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = kind === 'err' ? 'show err' : 'show';
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.className = ''; }, 2200);
  }

  // ---------- storage (browser localStorage — standalone version) ----------
  var LS_CARDS = 'ap_tangocho_cards';
  var LS_STREAK = 'ap_tangocho_streak';

  function loadAll(){
    try{
      var raw = localStorage.getItem(LS_CARDS);
      cards = raw ? JSON.parse(raw) : [];
    }catch(e){ cards = []; }
    try{
      var raw2 = localStorage.getItem(LS_STREAK);
      streak = raw2 ? JSON.parse(raw2) : { count:0, lastDate:'' };
    }catch(e){ streak = { count:0, lastDate:'' }; }
    renderAll();
  }
  function persistCards(){
    try{ localStorage.setItem(LS_CARDS, JSON.stringify(cards)); }
    catch(e){ showToast('保存に失敗しました', 'err'); }
  }
  function persistStreak(){
    try{ localStorage.setItem(LS_STREAK, JSON.stringify(streak)); }catch(e){}
  }

  function bumpStreak(){
    var today = todayStr();
    if(streak.lastDate === today) return;
    var yesterday = addDays(today, -1);
    streak.count = (streak.lastDate === yesterday) ? (streak.count + 1) : 1;
    streak.lastDate = today;
    persistStreak();
    document.getElementById('streakCount').textContent = streak.count;
  }

  // ---------- tabs ----------
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); });
  });
  function switchTab(name){
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === name); });
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.id === 'view-'+name); });
    if(name === 'review') renderReview();
    if(name === 'list') renderList();
    if(name === 'stats') renderStats();
  }

  // ---------- render dispatcher ----------
  function renderAll(){
    document.getElementById('streakCount').textContent = streak.count;
    renderReview();
    renderList();
    renderStats();
  }

  // =========================================================
  // REVIEW
  // =========================================================
  function dueCards(catSet){
    var today = todayStr();
    return cards.filter(function(c){ return c.nextReview <= today && catSet.has(c.category); });
  }

  function renderReviewSetup(){
    var wrap = document.getElementById('reviewSetup');
    if(cards.length === 0){ wrap.innerHTML = ''; return; }
    var due = dueCards(reviewCatFilter);
    var chips = CAT_ORDER.map(function(k){
      var on = reviewCatFilter.has(k);
      return '<span class="chip chip-toggle '+CATS[k].cls+(on?' on':'')+'" data-cat="'+k+'" role="button" tabindex="0">'+CATS[k].label+'</span>';
    }).join('');
    wrap.innerHTML =
      '<div class="cat-filter-row">'+chips+'</div>'+
      '<div class="due-count">今日の復習対象：<strong>'+due.length+'</strong> 枚</div>';
    wrap.querySelectorAll('.chip-toggle').forEach(function(el){
      el.addEventListener('click', function(){
        var k = el.dataset.cat;
        if(reviewCatFilter.has(k)){ if(reviewCatFilter.size>1) reviewCatFilter.delete(k); }
        else reviewCatFilter.add(k);
        reviewQueue = [];
        renderReview();
      });
    });
  }

  function renderReview(){
    renderReviewSetup();
    var area = document.getElementById('reviewArea');

    if(cards.length === 0){
      area.innerHTML =
        '<div class="panel empty-state">'+
          '<div class="big">🗂️</div>'+
          '<p>まだカードがありません。過去問でつまずいた用語を「追加」タブから登録すると、ここに復習キューが表示されます。</p>'+
          '<button class="btn-primary" id="goAddBtn">最初のカードを追加する</button>'+
        '</div>';
      document.getElementById('goAddBtn').addEventListener('click', function(){ switchTab('add'); });
      return;
    }

    if(reviewQueue.length === 0){
      reviewQueue = shuffle(dueCards(reviewCatFilter).map(function(c){ return c.id; }));
    }
    if(reviewQueue.length === 0){
      var nextDates = cards.filter(function(c){ return reviewCatFilter.has(c.category); })
        .map(function(c){ return c.nextReview; }).sort();
      var nextDate = nextDates.length ? nextDates[0] : null;
      area.innerHTML =
        '<div class="panel empty-state">'+
          '<div class="big">✅</div>'+
          '<p>今日の分は復習し終わりました。お疲れさまでした。'+
          (nextDate ? '<br>次の復習予定：<strong>'+esc(nextDate)+'</strong>' : '')+'</p>'+
          '<button class="btn-primary" id="reviewAllBtn">対象カードをもう一周する</button>'+
        '</div>';
      document.getElementById('reviewAllBtn').addEventListener('click', function(){
        reviewQueue = shuffle(cards.filter(function(c){ return reviewCatFilter.has(c.category); }).map(function(c){ return c.id; }));
        revealed = false;
        renderReviewCard();
      });
      return;
    }

    revealed = false;
    renderReviewCard();
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function renderReviewCard(){
    var area = document.getElementById('reviewArea');
    if(reviewQueue.length === 0){ renderReview(); return; }
    var id = reviewQueue[0];
    currentCard = cards.find(function(c){ return c.id === id; });
    if(!currentCard){ reviewQueue.shift(); renderReviewCard(); return; }
    var c = currentCard;
    var cat = CATS[c.category];

    var dotsHtml = '';
    for(var i=1;i<=5;i++){ dotsHtml += '<span class="'+(i<=c.box?'filled':'')+'"></span>'; }

    var detailHtml = c.detail ? '<div class="answer-block-label">詳しい説明</div><p class="answer-detail">'+esc(c.detail)+'</p>' : '';
    var mnemonicHtml = c.mnemonic ? '<div class="mnemonic-box">💡 '+esc(c.mnemonic)+'</div>' : '';
    var relatedHtml = c.related ? '<div class="related-line">関連：'+esc(c.related)+'</div>' : '';

    area.innerHTML =
      '<div class="flip-stage"><div class="review-card">'+
        '<div class="card-meta">'+
          '<span class="chip '+cat.cls+'">'+cat.label+'</span>'+
          (c.examRef ? '<span class="exam-ref">'+esc(c.examRef)+'</span>' : '<span></span>')+
        '</div>'+
        '<div class="term-face">'+
          '<div class="term-word">'+esc(c.term)+'</div>'+
          '<div class="term-hint">タップして意味を確認</div>'+
        '</div>'+
        '<div class="answer-wrap">'+
          '<div class="answer-content">'+
            '<p class="answer-short">'+esc(c.shortDef)+'</p>'+
            detailHtml + mnemonicHtml + relatedHtml +
          '</div>'+
          '<div class="red-sheet" id="redSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>タップで赤シートをめくる</span></div>'+
        '</div>'+
        '<div class="answer-actions">'+
          '<button class="abtn again" id="btnAgain" disabled>もう一度<small>box→1</small></button>'+
          '<button class="abtn unsure" id="btnUnsure" disabled>あいまい<small>変化なし</small></button>'+
          '<button class="abtn know" id="btnKnow" disabled>覚えた<small>box→'+Math.min(5,c.box+1)+'</small></button>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">'+
          '<div class="box-dots">'+dotsHtml+'</div>'+
          '<span class="mono" style="font-size:11px;color:var(--ink-faint);">残り '+reviewQueue.length+' 枚</span>'+
        '</div>'+
      '</div></div>';

    document.getElementById('redSheet').addEventListener('click', revealAnswer);
    document.getElementById('btnAgain').addEventListener('click', function(){ answerCard('again'); });
    document.getElementById('btnUnsure').addEventListener('click', function(){ answerCard('unsure'); });
    document.getElementById('btnKnow').addEventListener('click', function(){ answerCard('know'); });
  }

  function revealAnswer(){
    if(revealed) return;
    revealed = true;
    document.getElementById('redSheet').classList.add('lifted');
    ['btnAgain','btnUnsure','btnKnow'].forEach(function(id){ document.getElementById(id).disabled = false; });
  }

  function answerCard(result){
    if(!currentCard) return;
    var c = currentCard;
    var today = todayStr();
    c.reviewCount = (c.reviewCount||0) + 1;
    c.lastReviewed = today;

    if(result === 'again'){
      c.box = 1;
      c.nextReview = today;
      reviewQueue.push(reviewQueue.shift());
    } else if(result === 'unsure'){
      c.nextReview = today;
      reviewQueue.push(reviewQueue.shift());
    } else {
      c.box = Math.min(5, c.box + 1);
      c.nextReview = addDays(today, INTERVAL_DAYS[c.box]);
      reviewQueue.shift();
    }
    bumpStreak();
    persistCards();
    revealed = false;
    renderReviewSetup();
    renderReviewCard();
  }

  // =========================================================
  // ADD / EDIT FORM
  // =========================================================
  function resetFormFields(){
    document.getElementById('f-term').value = '';
    document.getElementById('f-cat').value = 'tech';
    document.getElementById('f-ref').value = '';
    document.getElementById('f-short').value = '';
    document.getElementById('f-detail').value = '';
    document.getElementById('f-mnemonic').value = '';
    document.getElementById('f-related').value = '';
  }

  function submitCardForm(){
    var term = document.getElementById('f-term').value.trim();
    var category = document.getElementById('f-cat').value;
    var shortDef = document.getElementById('f-short').value.trim();
    var detail = document.getElementById('f-detail').value.trim();
    var mnemonic = document.getElementById('f-mnemonic').value.trim();
    var related = document.getElementById('f-related').value.trim();
    var examRef = document.getElementById('f-ref').value.trim();

    if(!term || !shortDef){ showToast('用語と「一言でいうと」は必須です', 'err'); return; }

    if(editingId){
      var c = cards.find(function(x){ return x.id === editingId; });
      if(c){
        c.term = term; c.category = category; c.shortDef = shortDef;
        c.detail = detail; c.mnemonic = mnemonic; c.related = related; c.examRef = examRef;
        showToast('カードを更新しました');
      }
      exitEditMode();
    } else {
      var today = todayStr();
      cards.push({
        id: uid(), term: term, category: category, shortDef: shortDef,
        detail: detail, mnemonic: mnemonic, related: related, examRef: examRef,
        box: 1, reviewCount: 0, correctStreak: 0,
        lastReviewed: null, nextReview: today, createdAt: today
      });
      showToast('カードを追加しました');
    }
    persistCards();
    resetFormFields();
    reviewQueue = [];
    renderList();
    renderStats();
    renderReviewSetup();
  }

  document.getElementById('submitBtn').addEventListener('click', submitCardForm);
  document.getElementById('cancelEditBtn').addEventListener('click', exitEditMode);
  ['f-term','f-ref','f-mnemonic','f-related'].forEach(function(id){
    document.getElementById(id).addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); submitCardForm(); }
    });
  });

  function enterEditMode(id){
    var c = cards.find(function(x){ return x.id === id; });
    if(!c) return;
    editingId = id;
    document.getElementById('f-term').value = c.term;
    document.getElementById('f-cat').value = c.category;
    document.getElementById('f-ref').value = c.examRef || '';
    document.getElementById('f-short').value = c.shortDef;
    document.getElementById('f-detail').value = c.detail || '';
    document.getElementById('f-mnemonic').value = c.mnemonic || '';
    document.getElementById('f-related').value = c.related || '';
    document.getElementById('formTitle').textContent = 'カードを編集';
    document.getElementById('submitBtn').textContent = '更新する';
    document.getElementById('formActions').classList.add('editing');
    switchTab('add');
  }
  function exitEditMode(){
    editingId = null;
    resetFormFields();
    document.getElementById('formTitle').textContent = '新しいカードを追加';
    document.getElementById('submitBtn').textContent = 'カードを追加';
    document.getElementById('formActions').classList.remove('editing');
  }

  // =========================================================
  // LIST
  // =========================================================
  var listFilterWrap = document.getElementById('listCatFilter');
  listFilterWrap.innerHTML = CAT_ORDER.map(function(k){
    return '<span class="chip chip-toggle on '+CATS[k].cls+'" data-cat="'+k+'" role="button" tabindex="0">'+CATS[k].label+'</span>';
  }).join('');
  listFilterWrap.querySelectorAll('.chip-toggle').forEach(function(el){
    el.addEventListener('click', function(){
      var k = el.dataset.cat;
      if(listCatFilter.has(k)){ if(listCatFilter.size>1) listCatFilter.delete(k); }
      else listCatFilter.add(k);
      el.classList.toggle('on', listCatFilter.has(k));
      renderList();
    });
  });
  document.getElementById('searchInput').addEventListener('input', function(e){
    listSearch = e.target.value.trim().toLowerCase();
    renderList();
  });

  function renderList(){
    var area = document.getElementById('listArea');
    var countEl = document.getElementById('listCount');
    var filtered = cards.filter(function(c){
      if(!listCatFilter.has(c.category)) return false;
      if(listSearch){
        var hay = (c.term+' '+c.shortDef+' '+(c.detail||'')+' '+(c.related||'')).toLowerCase();
        if(hay.indexOf(listSearch) === -1) return false;
      }
      return true;
    }).sort(function(a,b){ return a.nextReview < b.nextReview ? -1 : 1; });

    countEl.textContent = cards.length === 0 ? '' : filtered.length + ' / ' + cards.length + ' 枚';

    if(cards.length === 0){
      area.innerHTML = '<div class="panel empty-state"><div class="big">📇</div><p>登録されたカードはまだありません。</p></div>';
      return;
    }
    if(filtered.length === 0){
      area.innerHTML = '<div class="panel empty-state"><p>条件に一致するカードがありません。</p></div>';
      return;
    }

    area.innerHTML = filtered.map(function(c){
      var cat = CATS[c.category];
      if(confirmDeleteId === c.id){
        return '<div class="card-row '+cat.cls+'">'+
          '<div class="row-main"><div class="row-term">'+esc(c.term)+'</div></div>'+
          '<div class="confirm-row">'+
            '<span>削除する？</span>'+
            '<button class="yes" data-yes="'+c.id+'">削除</button>'+
            '<button class="no" data-no="'+c.id+'">取消</button>'+
          '</div></div>';
      }
      return '<div class="card-row '+cat.cls+'">'+
        '<div class="row-main">'+
          '<div class="row-term">'+esc(c.term)+'</div>'+
          '<div class="row-def">'+esc(c.shortDef)+'</div>'+
          '<div class="row-tags">'+
            '<span class="chip '+cat.cls+'">'+cat.label+'</span>'+
            '<span class="mono" style="font-size:11px;color:var(--ink-faint);">box '+c.box+' ・ 次回 '+esc(c.nextReview)+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="row-actions">'+
          '<button class="icon-btn" data-edit="'+c.id+'" aria-label="編集"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>'+
          '<button class="icon-btn" data-del="'+c.id+'" aria-label="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>'+
        '</div>'+
      '</div>';
    }).join('');

    area.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click', function(){ enterEditMode(b.dataset.edit); }); });
    area.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(){ confirmDeleteId = b.dataset.del; renderList(); }); });
    area.querySelectorAll('[data-yes]').forEach(function(b){ b.addEventListener('click', function(){
      cards = cards.filter(function(c){ return c.id !== b.dataset.yes; });
      confirmDeleteId = null;
      persistCards();
      reviewQueue = [];
      showToast('カードを削除しました');
      renderList(); renderStats(); renderReviewSetup();
    }); });
    area.querySelectorAll('[data-no]').forEach(function(b){ b.addEventListener('click', function(){ confirmDeleteId = null; renderList(); }); });
  }

  // =========================================================
  // STATS
  // =========================================================
  function backupPanelHtml(){
    return '<div class="panel" style="margin-top:16px;">'+
      '<h2 class="section-title">データのバックアップ</h2>'+
      '<p style="font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 12px;">'+
        'カードはこのブラウザに保存されます。他の端末と同じ内容にしたいときは、iCloud DriveなどのフォルダにJSONを書き出し、もう片方の端末でそのファイルを読み込んでください。同じ用語は内容が上書き更新され、新しいものは追加されます。'+
      '</p>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
        '<button class="btn-primary" id="exportBtn">バックアップを書き出す</button>'+
        '<button class="btn-ghost" id="importBtn" style="display:inline-block;">バックアップを読み込む</button>'+
      '</div>'+
      '<input type="file" id="importFile" accept="application/json" style="display:none">'+
    '</div>';
  }
  function bindBackupEvents(){
    document.getElementById('exportBtn').addEventListener('click', exportData);
    document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFile').click(); });
    document.getElementById('importFile').addEventListener('change', function(e){
      if(e.target.files && e.target.files[0]) importData(e.target.files[0]);
      e.target.value = '';
    });
  }
  function exportData(){
    var data = { cards: cards, streak: streak, exportedAt: todayStr() };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ap_tangocho_backup_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('バックアップを書き出しました');
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        if(!data || !Array.isArray(data.cards)) throw new Error('invalid');
        var byId = {};
        cards.forEach(function(c){ byId[c.id] = c; });
        var added = 0, updated = 0;
        data.cards.forEach(function(c){
          if(!c || !c.id || !c.term || !c.shortDef) return;
          if(byId[c.id]){
            Object.assign(byId[c.id], c);
            updated++;
          } else {
            cards.push(c);
            byId[c.id] = c;
            added++;
          }
        });
        if(data.streak && typeof data.streak.count === 'number'){
          if(!streak.lastDate || data.streak.lastDate > streak.lastDate){
            streak = data.streak;
            persistStreak();
          }
        }
        persistCards();
        reviewQueue = [];
        renderAll();
        showToast('追加 '+added+'件・更新 '+updated+'件を読み込みました');
      }catch(err){
        showToast('読み込みに失敗しました。ファイル形式を確認してください', 'err');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  function renderStats(){
    var area = document.getElementById('statsArea');
    if(cards.length === 0){
      area.innerHTML = '<div class="panel empty-state"><div class="big">📊</div><p>カードを追加すると、ここに学習状況が表示されます。</p></div>' + backupPanelHtml();
      bindBackupEvents();
      return;
    }
    var today = todayStr();
    var due = cards.filter(function(c){ return c.nextReview <= today; }).length;
    var mastered = cards.filter(function(c){ return c.box === 5; }).length;

    var boxCounts = [0,0,0,0,0,0];
    cards.forEach(function(c){ boxCounts[c.box]++; });
    var maxBox = Math.max.apply(null, boxCounts.slice(1).concat([1]));

    var boxHtml = '';
    for(var i=1;i<=5;i++){
      var pct = Math.round((boxCounts[i]/maxBox)*100);
      boxHtml += '<div class="box-bar-row"><span class="bl">box '+i+'</span>'+
        '<div class="box-bar-track"><div class="box-bar-fill" style="width:'+pct+'%"></div></div>'+
        '<span class="bn">'+boxCounts[i]+'</span></div>';
    }

    var catHtml = CAT_ORDER.map(function(k){
      var n = cards.filter(function(c){ return c.category === k; }).length;
      if(n === 0) return '';
      return '<div class="cat-stat-row"><span class="chip '+CATS[k].cls+'">'+CATS[k].label+'</span><span class="mono">'+n+' 枚</span></div>';
    }).join('');

    area.innerHTML =
      '<div class="stat-grid">'+
        '<div class="stat-card"><div class="num">'+cards.length+'</div><div class="lbl">総カード数</div></div>'+
        '<div class="stat-card"><div class="num">'+due+'</div><div class="lbl">本日の復習対象</div></div>'+
        '<div class="stat-card"><div class="num">'+mastered+'</div><div class="lbl">習得済み（box5）</div></div>'+
      '</div>'+
      '<div class="panel" style="margin-bottom:16px;">'+
        '<h2 class="section-title">習熟度の分布（Leitner box）</h2>'+
        '<div class="box-bars">'+boxHtml+'</div>'+
      '</div>'+
      '<div class="panel">'+
        '<h2 class="section-title">分野別カード数</h2>'+
        '<div class="cat-stats">'+catHtml+'</div>'+
      '</div>' + backupPanelHtml();
    bindBackupEvents();
  }

  // ---------- init ----------
  loadAll();
})();
</script>
</body>
</html>
